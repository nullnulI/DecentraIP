name: Finalize demo video
on:
  push:
    branches: [main]
    paths: ['.demo-upload/**']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify complete recording
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .demo-upload -name '*.part' | wc -l)" -eq 15
          cat .demo-upload/*.part > docs/media/demo.mp4
          test "$(git hash-object docs/media/demo.mp4)" = dd613e78df3a68992bd5ca49b3bbd361f2f3c441
          git rm -r .demo-upload
          git rm .github/workflows/finalize-demo.yml
          git add docs/media/demo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add full demo recording and remove upload staging"
          git push origin HEAD:main
